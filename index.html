<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اتاق فرماندهی موشکی</title>
<style>
  body, html { 
    margin: 0; padding: 0; overflow: hidden; 
    background-color: #000; font-family: Tahoma, Arial, sans-serif; 
    touch-action: none;
  }
  
  /* پس‌زمینه نقشه واقعی */
  #game-board {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 80px;
    background-image: url('map.jpg');
    background-size: cover;
    background-position: center;
    cursor: crosshair;
  }

  /* فوتر ساختاریافته با پالت مشکی و طلایی */
  #ui-footer {
    position: absolute;
    bottom: 0; width: 100%; height: 80px;
    background-color: #0a0a0a;
    border-top: 3px solid #D4AF37;
    box-shadow: 0 -5px 25px rgba(212, 175, 55, 0.2);
    display: flex;
    justify-content: space-around;
    align-items: center;
    color: #D4AF37;
    z-index: 100;
  }

  .missile-btn {
    background: #1a1a1a;
    color: #D4AF37;
    border: 1px solid #D4AF37;
    padding: 10px 25px;
    border-radius: 3px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .missile-btn:hover, .missile-btn.active {
    background: #D4AF37;
    color: #000;
  }

  #target-marker {
    position: absolute;
    width: 30px; height: 30px;
    border: 2px solid red;
    border-radius: 50%;
    display: none;
    transform: translate(-50%, -50%);
  }

  #target-marker::after, #target-marker::before {
    content: ''; position: absolute; background: red;
  }
  #target-marker::before { top: -10px; bottom: -10px; left: 13px; width: 2px; }
  #target-marker::after { left: -10px; right: -10px; top: 13px; height: 2px; }

  /* موشک واقعی */
  .missile-sprite {
    position: absolute;
    width: 40px; height: 120px;
    background-image: url('missile.png');
    background-size: contain;
    background-repeat: no-repeat;
    display: none;
    transform-origin: bottom center;
  }
</style>
</head>
<body>

<div id="game-board">
  <div id="target-marker"></div>
  <div id="missile" class="missile-sprite"></div>
</div>

<div id="ui-footer">
  <div>انتخاب سلاح:</div>
  <button class="missile-btn active">موشک بالستیک ایرانی</button>
  <div id="status">وضعیت: روی نقشه کلیک کنید...</div>
</div>

<script>
  const board = document.getElementById('game-board');
  const marker = document.getElementById('target-marker');
  const missile = document.getElementById('missile');
  const statusTxt = document.getElementById('status');
  
  let isFiring = false;

  board.addEventListener('pointerdown', (e) => {
    if(isFiring) return;
    
    // نمایش نشانگر هدف روی نقشه واقعی
    marker.style.display = 'block';
    marker.style.left = e.clientX + 'px';
    marker.style.top = e.clientY + 'px';
    statusTxt.innerText = `هدف قفل شد: [${e.clientX}, ${e.clientY}]`;
    
    // شلیک موشک
    setTimeout(() => fireMissile(e.clientX, e.clientY), 500);
  });

  function fireMissile(targetX, targetY) {
    isFiring = true;
    missile.style.display = 'block';
    
    // نقطه شروع (پایین صفحه وسط)
    let startX = window.innerWidth / 2;
    let startY = window.innerHeight;
    
    let currentX = startX;
    let currentY = startY;
    
    // محاسبه زاویه چرخش عکس موشک به سمت هدف
    let angle = Math.atan2(targetY - startY, targetX - startX) * 180 / Math.PI;
    missile.style.transform = `translate(-50%, -100%) rotate(${angle + 90}deg)`;

    function animate() {
      let dx = targetX - currentX;
      let dy = targetY - currentY;
      let dist = Math.sqrt(dx*dx + dy*dy);
      
      if(dist < 10) {
        // برخورد به هدف
        statusTxt.innerText = "هدف منهدم شد!";
        missile.style.display = 'none';
        marker.style.display = 'none';
        setTimeout(() => { isFiring = false; statusTxt.innerText = "آماده شلیک بعدی"; }, 2000);
        return;
      }
      
      // حرکت به سمت هدف
      currentX += (dx/dist) * 15;
      currentY += (dy/dist) * 15;
      
      missile.style.left = currentX + 'px';
      missile.style.top = currentY + 'px';
      
      requestAnimationFrame(animate);
    }
    animate();
  }
</script>
</body>
</html>
